<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Detalhes do Produto</title>
  <link rel="stylesheet" href="/src/styles/Home/reset.css">
  <link rel="stylesheet" href="/src/styles/Home/components.css">
  <style>
    body { background: #f5f5f5; font-family: Roboto, sans-serif; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .breadcrumb { margin-bottom: 20px; font-size: 12px; }
    .breadcrumb a { color: #ff6500; text-decoration: none; }
    .produto-principal { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; background: white; padding: 30px; border-radius: 8px; margin-bottom: 30px; }
    .produto-imagem { display: flex; flex-direction: column; gap: 12px; }
    .img-principal { width: 100%; max-height: 500px; object-fit: cover; border-radius: 8px; border: 1px solid #eee; }
    .imgs-menores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .imgs-menores img { width: 100%; height: 100px; object-fit: cover; border-radius: 4px; border: 2px solid transparent; cursor: pointer; }
    .imgs-menores img:hover, .imgs-menores img.ativo { border-color: #ff6500; }
    .produto-info { display: flex; flex-direction: column; gap: 24px; }
    .nome-produto { font-size: 24px; font-weight: bold; color: #333; }
    .rating { display: flex; gap: 8px; align-items: center; font-size: 14px; }
    .stars { color: #ffd700; }
    .preco-container { border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 16px 0; }
    .preco-antigo { color: #999; text-decoration: line-through; font-size: 16px; }
    .preco-atual { font-size: 32px; color: #ff6500; font-weight: bold; display: block; margin: 8px 0; }
    .parcelas { font-size: 14px; color: #666; }
    .especificacoes { background: #f9f9f9; padding: 16px; border-radius: 4px; margin: 16px 0; }
    .especificacoes h4 { margin-bottom: 12px; color: #333; }
    .spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .spec-item { padding: 8px; }
    .spec-label { font-weight: bold; font-size: 12px; color: #666; text-transform: uppercase; }
    .spec-valor { font-size: 14px; color: #333; margin-top: 4px; }
    .acoes { display: flex; gap: 12px; margin: 16px 0; }
    .btn-comprar { flex: 1; background: #ff6500; color: white; padding: 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; }
    .btn-comprar:hover { background: #e55a00; }
    .btn-curtir { width: 50px; height: 50px; background: transparent; border: 2px solid #ff6500; border-radius: 4px; color: #ff6500; font-size: 24px; cursor: pointer; }
    .btn-curtir.liked { background: #ff6500; color: white; }
    .descricao-completa { background: white; padding: 30px; border-radius: 8px; margin-top: 30px; }
    .descricao-completa h3 { margin-bottom: 16px; }
    .descricao-completa p { line-height: 1.6; color: #666; margin-bottom: 12px; }
    .voltar { display: inline-block; margin-bottom: 20px; color: #ff6500; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/home.html" class="voltar">← Voltar à home</a>

    <div class="breadcrumb" id="breadcrumb">
      <a href="/home.html">Home</a> > <span id="breadcrumb-nome">Produto</span>
    </div>

    <div class="produto-principal">
      <div class="produto-imagem">
        <img id="img-principal" src="" alt="Produto" class="img-principal">
        <div class="imgs-menores" id="imgs-menores"></div>
      </div>

      <div class="produto-info">
        <h1 class="nome-produto" id="nome-produto"></h1>

        <div class="rating">
          <span class="stars">★★★★★</span>
          <span>(0 avaliações)</span>
        </div>

        <div class="preco-container">
          <div class="preco-antigo" id="preco-antigo"></div>
          <div class="preco-atual" id="preco-atual"></div>
          <div class="parcelas" id="parcelas"></div>
        </div>

        <div class="especificacoes" id="especificacoes-box">
          <h4>Especificações principais</h4>
          <div class="spec-grid" id="specs-principais"></div>
        </div>

        <div class="acoes">
          <button class="btn-comprar" id="btn-comprar-modal">COMPRAR</button>
          <button class="btn-curtir" id="btn-curtir-produto">❤</button>
        </div>

        <p id="msg-feedback" style="color: green; font-weight: bold; display: none;"></p>
      </div>
    </div>

    <div class="descricao-completa">
      <h3>Descrição do Produto</h3>
      <p id="descricao-completa"></p>
      <h3 style="margin-top: 24px;">Especificações Completas</h3>
      <div class="spec-grid" id="specs-completas" style="grid-template-columns: repeat(3, 1fr);"></div>
    </div>
  </div>

  <script type="module" src="/src/pages/produto.js"></script>
</body>
</html>
